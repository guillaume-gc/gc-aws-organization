name: Deploy resources

on:
  workflow_call

jobs:
  deploy-terraform:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      TF_CLI_ARGS: -no-color
      TF_BACKEND_BUCKET: ${{ vars.CICD_TERRAFORM_STATE_BUCKET }}
      TF_BACKEND_REGION: ${{ vars.CICD_AWS_REGION }}
      TF_VAR_git_branch_name: main
      TF_VAR_aws_default_region: ${{ vars.CICD_AWS_REGION }}
      TF_VAR_service_name: ${{ vars.CICD_SERVICE_NAME }}
      TF_VAR_notification_emails: '["${{ vars.CICD_NOTIFICATION_EMAIL }}"]'

    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.10.0

      - name: Create Temporary AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CICD_IAM_ROLE }}
          aws-region: ${{ vars.CICD_AWS_REGION }}

      - name: Display Project Repository
        run: ls ./ -a

      - name: Terraform Init
        run: mise run init

      - name: Terraform Format Check
        run: mise run fmt -- -check

      - name: Terraform Validate
        run: mise run validate

      - name: Terraform Apply
        run: terraform apply -auto-approve
